kind = "mobile"
previewPath = "/"
title = "Twirlblade"
description = "Twirlblade: an Android-only, offline, portrait knife-throwing arcade game. Tap to throw knives into a spinning target without hitting stuck knives, slice apples, beat a boss every 5th stage across 12 worlds, and collect 50 cosmetic knives in four modes (Endless, Fixed Run, Daily Challenge, Time Attack). Includes power-ups, achievements, daily missions, a 7-day gift, a two-currency store and AdMob ads. Family-friendly."
version = "1.0.0"
id = "artifacts/blade-rush"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19401

[services.development]
run = "pnpm --filter @workspace/blade-rush run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blade-rush", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/blade-rush", "run", "serve" ]

[services.env]
PORT = "19401"
BASE_PATH = "/"
