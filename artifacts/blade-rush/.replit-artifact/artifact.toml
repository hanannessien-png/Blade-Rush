kind = "mobile"
previewPath = "/"
title = "Blade Rush"
description = "An Android-only, offline, portrait knife-throwing arcade game. Tap to throw knives into a rotating target without hitting stuck knives, slice apples for currency, beat a boss every 5th stage, and collect 50 cosmetic knives across four modes (Endless, Fixed Run, Daily Challenge, Time Attack). Includes power-ups, achievements, daily missions, a 7-day daily gift, a two-currency store (apples and gems), and AdMob ads behind a swappable ad service with empty ad IDs. Family-friendly, all ages."
version = "1.0.0"
id = "artifacts/blade-rush"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19401

[services.development]
run = "pnpm --filter @workspace/blade-rush run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blade-rush", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/blade-rush", "run", "serve" ]

[services.env]
PORT = "19401"
BASE_PATH = "/"
